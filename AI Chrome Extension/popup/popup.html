<!DOCTYPE html>
<html>
<head>
  <title>AI Job Application Autofill</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">AI</div>
      <h1>AI Job Application Autofill</h1>
    </div>
    
    <div id="login-message" class="status">
      <i class="fas fa-info-circle"></i>
      <p id="statusMessage">
        Sign in to your account on <strong>localhost:5173</strong> to automatically connect your resume data.
      </p>
    </div>
    
    <!-- Hidden input field, not visible to user but still functional -->
    <div class="hidden-field">
      <input type="hidden" id="clerk-id-input" />
    </div>
    
    <div class="actions">
      <button id="autofillForm" class="primary-btn">
        <div class="btn-content">
          <i class="fas fa-magic"></i>
          Fill Form with HandsJob AI
        </div>
      </button>
    </div>
    
    <div class="footer">
      <button class="icon-btn" title="Help" id="helpButton">
        <i class="fas fa-question-circle"></i>
      </button>
      <button class="icon-btn" title="Settings" id="settingsButton">
        <i class="fas fa-cog"></i>
      </button>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
