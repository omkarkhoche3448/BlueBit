<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Job Application Autofill</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>AI Job Application Autofill</h1>
    
    <div class="clerk-id-container">
      <label for="clerk-id-input">Enter your Clerk ID:</label>
      <input type="text" id="clerk-id-input" placeholder="Your Clerk ID">
    </div>
    
    <div class="actions">
      <button id="autofillForm">Fill Form</button>
    </div>
    
    <div class="status">
      <p id="statusMessage">Enter your Clerk ID and click "Fill Form" to automatically fill the job application.</p>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
