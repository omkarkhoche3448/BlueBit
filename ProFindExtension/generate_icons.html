<!DOCTYPE html>
<html>
<head>
  <title>ProFind Extension Icon Generator</title>
</head>
<body>
  <h1>ProFind Extension Icon Generator</h1>
  <p>Click the button below to generate placeholder icons for your extension.</p>
  <button id="generate">Generate Icons</button>
  <div id="results"></div>

  <script>
    document.getElementById('generate').addEventListener('click', function() {
      const sizes = [16, 48, 128];
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '';

      sizes.forEach(size => {
        // Create canvas
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        // Draw background
        ctx.fillStyle = '#2563eb'; // Blue background
        ctx.fillRect(0, 0, size, size);

        // Draw "P" letter
        ctx.fillStyle = '#ffffff'; // White text
        ctx.font = `bold ${Math.floor(size * 0.7)}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('P', size/2, size/2);

        // Convert to data URL
        const dataUrl = canvas.toDataURL('image/png');
        
        // Create download link
        const link = document.createElement('a');
        link.href = dataUrl;
        link.download = `icon${size}.png`;
        link.textContent = `Download icon${size}.png`;
        link.style.display = 'block';
        link.style.margin = '10px 0';
        
        // Add image preview
        const img = document.createElement('img');
        img.src = dataUrl;
        img.style.border = '1px solid #ccc';
        img.style.marginRight = '10px';
        
        // Add to page
        resultsDiv.appendChild(img);
        resultsDiv.appendChild(link);
        resultsDiv.appendChild(document.createElement('br'));
      });
    });
  </script>
</body>
</html>
