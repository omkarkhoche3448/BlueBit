<!DOCTYPE html>
<html>
<head>
  <title>ProFind Autofill</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>ProFind Autofill</h1>
    </header>
    
    <div class="content">
      <!-- Login State -->
      <div id="login-state" class="hidden">
        <p>Please log in to your ProFind account to use autofill features.</p>
        <a href="http://localhost:5173/sign-in" target="_blank" class="button login-button">Login to ProFind</a>
      </div>
      
      <!-- Logged In State -->
      <div id="logged-in-state" class="hidden">
        <p>Logged in as: <span id="user-email">-</span></p>
        <p class="status-message">Your resume data is ready for autofill.</p>
        
        <div class="actions">
          <button id="autofill-page" class="button primary-button">Autofill This Page</button>
          <button id="view-resume-data" class="button secondary-button">View Resume Data</button>
          <button id="refresh-data" class="button secondary-button">Refresh Data</button>
          <button id="logout" class="button danger-button">Logout</button>
        </div>
      </div>
      
      <!-- Resume Data View -->
      <div id="resume-data-view" class="hidden">
        <h2>Your Resume Data</h2>
        <div id="resume-data-content"></div>
        <button id="back-to-main" class="button secondary-button">Back</button>
      </div>
      
      <!-- Loading State -->
      <div id="loading-state" class="hidden">
        <div class="spinner"></div>
        <p>Loading your data...</p>
      </div>
      
      <!-- Error State -->
      <div id="error-state" class="hidden">
        <p class="error-message" id="error-message">An error occurred.</p>
        <button id="retry" class="button primary-button">Try Again</button>
        <button id="test-api" class="button secondary-button">Test API Connection</button>
        <button id="use-sample-data" class="button secondary-button">Use Sample Data</button>
      </div>
    </div>
    
    <footer>
      <p>ProFind Autofill v1.0</p>
    </footer>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
